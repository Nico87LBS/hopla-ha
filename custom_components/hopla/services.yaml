# Names and descriptions are in strings.json and translations/.
complete_task:
  fields:
    task_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      selector:
        text:
create_task:
  fields:
    name:
      required: true
      selector:
        text:
    description:
      required: false
      selector:
        text:
          multiline: true
    due_date:
      required: false
      selector:
        text:
    created_by:
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      selector:
        text:
update_task:
  fields:
    task_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    name:
      required: false
      selector:
        text:
    description:
      required: false
      selector:
        text:
          multiline: true
    due_date:
      required: false
      selector:
        text:
    force_unarchive:
      required: false
      default: false
      selector:
        boolean:
    assigned_to:
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      required: false
      selector:
        text:
