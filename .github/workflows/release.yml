name: Release

# A new version in manifest.json on main becomes a GitHub release, which
# HACS offers as an update in Home Assistant.
on:
  push:
    branches: [main]
    paths: [custom_components/hopla/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/hopla/manifest.json)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Hopla $version" --generate-notes
