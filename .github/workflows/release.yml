name: Release

# A new version in manifest.json on main becomes a GitHub release, which
# HACS offers as an update in Home Assistant.
on:
  push:
    branches: [main]
    paths: [custom_components/hopla/manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and publish the release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/hopla/manifest.json)
          tag="v$version"
          # GitHub answers 500 now and then: try a few times.
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "Attempt $attempt failed, retrying"
              sleep $((attempt * 10))
            done
            return 1
          }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            retry gh release create "$tag" --target "$GITHUB_SHA" --title "Hopla $version" --generate-notes
          fi
          # A release can be left as a draft (no tag, invisible to HACS):
          # publish every draft release, this one included.
          for draft in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft) | .tag_name'); do
            echo "Publishing draft $draft"
            retry gh release edit "$draft" --draft=false --latest=false
          done
          retry gh release edit "$tag" --latest
