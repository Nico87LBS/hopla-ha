name: Validate

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * 0" 
  workflow_dispatch:

jobs:
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/test_user_card.mjs
        env:
          TZ: Europe/Brussels
      - run: node --experimental-default-type=module tests/test_family_card.mjs
        env:
          TZ: Europe/Brussels
      - run: node --experimental-default-type=module tests/test_family_zone.mjs
      - run: node --experimental-default-type=module tests/test_card_i18n.mjs
        env:
          TZ: Europe/Brussels
      - run: npm install --prefix "$RUNNER_TEMP/hopla-card-tests" --no-package-lock happy-dom@20.14.5
      - run: node --experimental-default-type=module tests/test_user_card_dom.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/hopla-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_family_zone_dom.mjs
        env:
          DOM_TEST_MODULE: ${{ runner.temp }}/hopla-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_editor.mjs
        env:
          DOM_TEST_MODULE: ${{ runner.temp }}/hopla-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_completed_card.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/hopla-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_updates.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/hopla-card-tests/node_modules/happy-dom/lib/index.js

  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  version-bump:
    # Every change needs a new version in manifest.json: merging it publishes
    # the release that HACS offers as an update.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The manifest version is higher than on the base branch
        run: |
          base=$(git show "origin/${{ github.base_ref }}:custom_components/hopla/manifest.json" | jq -r .version)
          head=$(jq -r .version custom_components/hopla/manifest.json)
          echo "base $base, this PR $head"
          if [ "$(printf '%s\n%s\n' "$base" "$head" | sort -V | tail -n1)" != "$head" ] || [ "$base" = "$head" ]; then
            echo "::error file=custom_components/hopla/manifest.json::Raise the version above $base so the merge publishes a release."
            exit 1
          fi
